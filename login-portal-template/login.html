<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">
    <title>Connexion - RAVIV</title>
  </head>
  <body>
    <main>
      <form method="post" action="/cas/login">
        <div id="formContent" class="form-fields">
          <div id="header">
            <img id="ravivLogo" src="res/img/raviv.png" alt="RAVIV">
            <span id="connexion">Connexion</span>
          </div>
          <div class="form-field">
            <label>Adresse mail</label>
            <input type="text" name="username" required>
          </div>
          <div class="form-field">
            <label>Mot de passe</label>
            <input type="password" name="password" required>
          </div>
          <div class="form-option">
            <input type="checkbox" id="rememberMe" name="rememberMe" value="true"/>
            <label for="rememberMe">Se souvenir de moi</label>
          </div>
          <input type="hidden" name="lt" value="${lt}">
          <input type="hidden" name="execution" value="${execution}">
          <div class="form-actions">
            <button type="submit" name="_eventId" value="submit">Se connecter</button>
            <a id="forgottenPassword" href="">Mot de passe oublié ?</a>
          </div>
        </div>
        <div id="copyright">
          <span>Copyright RAVIV &copy; 2025</span>
          <span>Tous droits réservés.</span>
        </div>
      </form>
      <div id="bigImage"></div>
    </main>
  </body>
</html>
