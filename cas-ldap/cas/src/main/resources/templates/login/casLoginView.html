<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
        <title>Connexion - RAVIV</title>
    </head>
    <body>
        <main>
            <!-- The form posts to CAS login endpoint. Use th:action to preserve context when rendered by Thymeleaf -->
            <form method="post" th:action="@{/login}" action="/cas/login">
                <div id="formContent" class="form-fields">
                    <div id="header">
                        <img id="ravivLogo" th:src="@{/images/raviv.png}" src="/cas/images/raviv.png" alt="RAVIV">
                        <span id="connexion">Connexion</span>
                    </div>
                    <div class="form-field">
                        <label>Nom d'utilisateur</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="form-field">
                        <label>Mot de passe</label>
                        <input type="password" name="password" required>
                    </div>
                    <div class="form-option">
                        <input type="checkbox" id="rememberMe" name="rememberMe" value="true"/>
                        <label for="rememberMe">Se souvenir de moi</label>
                    </div>
                    <!-- CAS expects lt and execution fields; render values from model if available -->
                    <input type="hidden" name="lt" th:value="${lt}"/>
                    <input type="hidden" name="execution" th:value="${execution}"/>
                    <!-- Include Spring Security CSRF token if present so POST is accepted -->
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="form-actions">
                        <button type="submit" name="_eventId" value="submit">Se connecter</button>
                        <a id="forgottenPassword" href="#">Mot de passe oublié ?</a>
                    </div>
                </div>
                <div id="copyright">
                    <span>Copyright RAVIV &copy; 2025</span>
                    <span>Tous droits réservés.</span>
                </div>
            </form>
            <div id="bigImage" th:style="|background-image: url('@{/images/big-image.png}');|" style="background-image: url('/cas/images/big-image.png');"></div>
        </main>
    </body>
</html>
