version: '3.9'

services:
  cas-server:
    image: apereo/cas:latest
    container_name: cas-server
    ports:
      - "8443:8443"
    environment:
      - CAS_SERVER_NAME=https://cas.localhost:8443
    volumes:
      - ./cas:/etc/cas
      - ./etc/cas/:/etc/cas
    restart: unless-stopped
  grav:
    image: lscr.io/linuxserver/grav:latest
    container_name: grav
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./grav/config:/config
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=secretpassword
    volumes:
      - ./mariadb:/var/lib/mysql

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=secretpassword
    volumes:
      - ./nextcloud:/var/www/html
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - db