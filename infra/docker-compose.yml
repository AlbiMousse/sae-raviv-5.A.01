version: '3.9'

services:
  cas-server:
    image: apereo/cas:latest
    container_name: cas-server
    ports:
      - "8082:8080"
    environment:
      - CAS_SERVER_NAME=http://localhost:8082
    volumes:
      - ./cas/config:/etc/cas/config
    restart: unless-stopped
  grav:
    image: lscr.io/linuxserver/grav:latest
    container_name: grav
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./grav/config:/config
    ports:
      - "8080:80"
    restart: unless-stopped

  nextcloud:
    image: nextcloud:26-apache  # Version 26 au lieu de 27
    container_name: nextcloud
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=password123
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
      - APACHE_DISABLE_REWRITE_IP=1
      #- CAS_SERVER_URL=http://localhost:8082/cas
      #- CAS_SERVICE_URL=http://localhost:8081
      #- CAS_AUTOCREATE_USER=1
    volumes:
      - nextcloud_data:/var/www/html
      #- ./nextcloud-apps:/var/www/html/apps
      #- ./nextcloud-config:/var/www/html/config
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  nextcloud_data:

